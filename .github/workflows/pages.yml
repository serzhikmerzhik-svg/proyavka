# Статичная версия «Проявки» на GitHub Pages: только клиент, без сервера.
# Работает: вход, демо-дни, свои дни (анализ текста — эвристикой в браузере, музыка — свой аудиофайл),
# девять процессов, глубина, запись проявки, ZIP. Нужен сервер: анализ моделью, поиск песен и превью,
# озвучка, ИИ-оживление — для них `npm run build && npm start` (см. README).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # нативные пакеты сборки (esbuild, rollup) приходят готовыми, install-скрипты не нужны
      - run: npm ci --ignore-scripts
      - run: npm test -w client
      - run: npm run build -w client
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # SPA: на любой неизвестный путь Pages отдаёт 404.html — пусть это будет само приложение
      - run: cp client/dist/index.html client/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
